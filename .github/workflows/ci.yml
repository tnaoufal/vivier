name: Vivier CI

# One run per pull request; each job checks only when its paths changed, so
# the required checks always report. CI never deploys: the Worker deploys
# through Cloudflare's Git integration and the processor through Railway.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Vivier frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'supabase/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - 'eslint.config.js'
              - 'components.json'
              - 'wrangler.jsonc'
              - '.github/workflows/ci.yml'
      - id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: "1.3.9"
      - name: Cache bun install cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-vivier-bun-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: No secret in a committed env file
        if: steps.gate.outputs.run == 'true'
        run: |
          set -e
          for f in $(git ls-files '.env' '.env.*'); do
            if grep -Ev '^\s*(#|$)' "$f" | grep -Eiv 'PUBLISHABLE' | grep -Ei '(KEY|SECRET|TOKEN|PASSWORD)\s*='; then
              echo "::error file=$f::a committed env file may only hold public values"; exit 1
            fi
          done
      # The build generates src/routeTree.gen.ts, which the typecheck and the
      # route tests import: it runs first.
      - name: Production build (no deployment)
        if: steps.gate.outputs.run == 'true'
        run: bun run build
      - name: Typecheck
        if: steps.gate.outputs.run == 'true'
        run: bun run typecheck
      - name: Tests
        if: steps.gate.outputs.run == 'true'
        run: bun run test
      - name: Nothing to check
        if: steps.gate.outputs.run != 'true'
        run: echo "No frontend file changed; nothing to check."

  processor:
    name: Vivier processor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: services/processor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            processor:
              - 'services/processor/**'
              - 'packages/analysis/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
      - id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.processor == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"
      # No lockfile yet (see the service README): a plain install until one is committed.
      # The install links the shared package (packages/analysis, a file:
      # dependency); the typecheck, the tests and the build each build it
      # first through the pre-scripts of package.json.
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Typecheck
        if: steps.gate.outputs.run == 'true'
        run: npm run typecheck
      - name: Tests
        if: steps.gate.outputs.run == 'true'
        run: npm test
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: npm run build
      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production container (no push or deployment)
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/processor/Dockerfile
          tags: vivier-processor:ci
          push: false
          load: true
          cache-from: type=gha,scope=vivier-processor
          cache-to: type=gha,mode=max,scope=vivier-processor
      - name: Smoke-test the container (health answers)
        if: steps.gate.outputs.run == 'true'
        run: |
          docker run -d --name processor -p 8080:8080 -e PROCESSOR_SHARED_SECRET=ci -e PROCESSOR_ALLOW_INSECURE_SECRET=1 vivier-processor:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health > health.json; then break; fi
            sleep 2
          done
          cat health.json; echo
          node -e "const h=require('./health.json'); if(!h.ok) process.exit(1)"
      - name: Container logs
        if: always() && steps.gate.outputs.run == 'true'
        run: docker logs processor 2>&1 | tail -n 50 || true
      - name: Nothing to check
        if: steps.gate.outputs.run != 'true'
        run: echo "No processor file changed; nothing to check."
