name: Vivier backup

# Nightly logical dump of the Vivier database and mirror of its `cvs`
# bucket to an R2 bucket, kept thirty days (docs/BACKUPS.md,
# scripts/backup.sh). The script reads everything from the
# environment; the values come from GitHub Actions secrets. Until the
# owner sets them the job ends early with a notice, so the workflow is
# green before the backup exists. A schedule only runs on the default
# branch, and GitHub pauses it after sixty days without a commit.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivier-backup
  cancel-in-progress: false

env:
  # Major version of the Supabase project (supabase/config.toml).
  # pg_dump refuses a server newer than itself, so the client is installed
  # from PGDG at this version instead of the runner's own.
  PG_MAJOR: "17"

jobs:
  backup:
    name: Vivier backup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - id: gate
        name: Are the backup secrets set?
        env:
          DATABASE_URL: ${{ secrets.VIVIER_DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.VIVIER_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.VIVIER_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.VIVIER_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.VIVIER_R2_SECRET_ACCESS_KEY }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.VIVIER_SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.VIVIER_SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.VIVIER_SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in DATABASE_URL R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
            SUPABASE_S3_ENDPOINT SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then missing="$missing VIVIER_$name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Vivier backup skipped::The GitHub Actions secrets$missing are not set; nothing was backed up. See docs/BACKUPS.md."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump and rclone
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "postgresql-client-${PG_MAJOR}" rclone
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --version
          rclone --version | head -n 1

      - name: Dump the database and mirror the bucket
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.VIVIER_DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.VIVIER_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.VIVIER_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.VIVIER_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.VIVIER_R2_SECRET_ACCESS_KEY }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.VIVIER_SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.VIVIER_SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.VIVIER_SUPABASE_S3_SECRET_ACCESS_KEY }}
          # Repository variable (Settings → Secrets and variables → Actions → Variables); eu-west-1 when unset.
          SUPABASE_S3_REGION: ${{ vars.VIVIER_SUPABASE_S3_REGION }}
        run: |
          bash scripts/backup.sh | tee backup-report.json
          {
            echo "### Vivier backup"
            echo
            echo '```json'
            tail -n 1 backup-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to back up
        if: steps.gate.outputs.run != 'true'
        run: echo "The backup secrets are not set; see docs/BACKUPS.md."
